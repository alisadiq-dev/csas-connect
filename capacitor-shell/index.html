<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a13" />
  <title>CSAS Connect</title>
  <style>
    html, body { height: 100%; margin: 0; background: #070a13; color: #bad7f5; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: center; text-align: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #f6b45a; margin: 18px auto 0; animation: p 1.2s ease-in-out infinite; }
    @keyframes p { 50% { transform: scale(1.8); opacity: .4; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1 style="margin:0;font-weight:300;font-size:1.6rem;color:#fff">CSAS Connect</h1>
    <p style="margin:.4rem 0 0;opacity:.7">Opening your portal…</p>
    <div class="dot" role="status" aria-label="Loading"></div>
  </main>
</body>
</html>
